on: 
  workflow_dispatch:

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - name: set api key
        run: echo "api_key=123456789" >> $GITHUB_ENV
      - name: masking the api key
        run: echo "::add-mask::$api_key"
      - name: use the masked api key
        run: echo "using the api key $api_key"
