on:
    push:
        branches:
            - main
            - 'releases/**'
        paths:
            - 'src/**'

    pull_request:
        branches:
            - main
            - 'releases/**'
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v7.0.1
        - name: run tests
          run: npm test
    